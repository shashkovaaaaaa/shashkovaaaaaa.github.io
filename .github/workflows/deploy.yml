name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Версия pnpm берётся из поля packageManager в package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Проверки до сборки. e2e в CI не гоняем: им нужен браузер (Chromium).
      - run: pnpm lint
      - run: pnpm typecheck

      - uses: actions/configure-pages@v6

      # Репозиторий <user>.github.io — сайт в корне домена, basePath пустой.
      - run: pnpm build
        env:
          NEXT_PUBLIC_BASE_PATH: ''
          # Абсолютные ссылки в Open Graph / canonical / hreflang / sitemap.
          NEXT_PUBLIC_SITE_URL: https://shashkovaaaaaa.github.io

      - uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
